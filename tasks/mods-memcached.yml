# tasks file
---
- name: php | mods | memcached | update memcached.ini
  ansible.builtin.template:
    src: "{{ php_fpm_ondrej_php_mods_available_path.lstrip('/') }}/memcached.ini.j2"
    dest: "{{ php_fpm_ondrej_php_mods_available_path }}/memcached.ini"
    owner: root
    group: root
    mode: '0644'
  notify: reload apache2
