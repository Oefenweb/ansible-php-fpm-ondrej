# tasks file
---
- name: version-support
  ansible.builtin.import_tasks: version-support.yml
  tags:
    - configuration
    - php-fpm-ondrej
    - php-fpm-ondrej-version-support

- name: repository
  ansible.builtin.import_tasks: repository.yml
  tags:
    - configuration
    - php-fpm-ondrej
    - php-fpm-ondrej-repository

- name: install
  ansible.builtin.import_tasks: install.yml
  tags:
    - configuration
    - php-fpm-ondrej
    - php-fpm-ondrej-install

# - name: configuration
#   ansible.builtin.import_tasks: configuration.yml
#   tags:
#     - configuration
#     - php-fpm-ondrej
#     - php-fpm-ondrej-configuration

- name: mods-install
  ansible.builtin.import_tasks: mods-install.yml
  tags:
    - configuration
    - php-fpm-ondrej
    - php-fpm-ondrej-mods-install

- name: php mods opcache
  ansible.builtin.import_tasks: mods-opcache.yml
  when:
    - "'opcache' in php_fpm_ondrej_php_mods_present_names"
  tags:
    - configuration
    - php-fpm-ondrej
    - php-fpm-ondrej-php
    - php-fpm-ondrej-php-mods
    - php-fpm-ondrej-php-mods-opcache

- name: php mods memcache
  ansible.builtin.import_tasks: mods-memcache.yml
  when:
    - "'memcache' in php_fpm_ondrej_php_mods_present_names"
  tags:
    - configuration
    - php-fpm-ondrej
    - php-fpm-ondrej-php
    - php-fpm-ondrej-php-mods
    - php-fpm-ondrej-php-mods-memcache

- name: php mods memcached
  ansible.builtin.import_tasks: mods-memcached.yml
  when:
    - "'memcached' in php_fpm_ondrej_php_mods_present_names"
  tags:
    - configuration
    - php-fpm-ondrej
    - php-fpm-ondrej-php
    - php-fpm-ondrej-php-mods
    - php-fpm-ondrej-php-mods-memcached

- name: mods-state
  ansible.builtin.import_tasks: mods-state.yml
  tags:
    - configuration
    - php-fpm-ondrej
    - php-fpm-ondrej-mods-state

- name: start and enable service
  ansible.builtin.service:
    name: php-fpm
    state: "{{ service_default_state | default('started') }}"
    enabled: "{{ service_default_enabled | default(true) | bool }}"
  tags:
    - configuration
    - php-fpm-ondrej
    - php-fpm-ondrej-apache
    - php-fpm-ondrej-apache-start-enable-service
